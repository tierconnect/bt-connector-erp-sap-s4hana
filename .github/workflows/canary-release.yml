name: Canary Release - Generate Source Archive

on:
  push:
    tags:
      - '*v'

jobs:
  check-canary-branch:
    runs-on: ubuntu-latest
    outputs:
      is-canary: ${{ steps.check.outputs.is-canary }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all branches and tags
        run: |
          # Delete all local tags before fetching to avoid "would clobber existing tag"
          # errors when a tag has been deleted and re-created on the remote.
          git tag -l | xargs -r git tag -d
          git fetch --all
          git fetch --tags --force

      - name: Get tag commit SHA
        id: get_tag_sha
        run: echo "tag_sha=$(git rev-list -n 1 ${{ github.ref }})" >> $GITHUB_OUTPUT

      - name: Debug branch and tag visibility
        run: |
          echo "=== Remote branches ==="
          git branch -r
          echo "=== Branches containing tag ==="
          git branch -r --contains ${{ steps.get_tag_sha.outputs.tag_sha }} || true

      - name: Check if tag is from canary branch
        id: check
        run: |
          # Get all branches that contain this tag
          BRANCHES=$(git branch -r --contains ${{ steps.get_tag_sha.outputs.tag_sha }} | grep -E "origin/canary/" || true)
          
          if [ -n "$BRANCHES" ]; then
            echo "is-canary=true" >> $GITHUB_OUTPUT
            echo "Tag is from canary branch: $BRANCHES"
          else
            echo "is-canary=false" >> $GITHUB_OUTPUT
            echo "Tag is not from a canary branch"
          fi

  create-release:
    needs: check-canary-branch
    if: needs.check-canary-branch.outputs.is-canary == 'true'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get tag name
        id: tag
        run: echo "tag-name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create source archive
        run: |
          # Build exclude argument array from .gitignore and .releaseignore
          EXCLUDE_ARGS=()

          # Add patterns from .gitignore (excluding comments and empty lines)
          if [ -f .gitignore ]; then
            while IFS= read -r pattern; do
              # Skip comments and empty lines
              if [[ ! "$pattern" =~ ^# ]] && [ -n "$pattern" ]; then
                EXCLUDE_ARGS+=(-x "$pattern")
              fi
            done < .gitignore
          fi

          # Add patterns from .releaseignore (excluding comments and empty lines)
          if [ -f .releaseignore ]; then
            while IFS= read -r pattern; do
              # Skip comments and empty lines
              if [[ ! "$pattern" =~ ^# ]] && [ -n "$pattern" ]; then
                EXCLUDE_ARGS+=(-x "$pattern")
              fi
            done < .releaseignore
          fi

          # Create zip file with source code
          eval "zip -r \"${{ github.event.repository.name }}-${{ steps.tag.outputs.tag-name }}.zip\" src/ documentation/ README.md .gcts.properties.json ${EXCLUDE_ARGS[@]}"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload artifact to S3
        env:
          S3_BUCKET_NAME: ${{ env.S3_BUCKET_NAME }}
          TAG_NAME: ${{ steps.tag.outputs.tag-name }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          ARTIFACT_FILE="${REPO_NAME}-${TAG_NAME}.zip"
          
          if [ ! -f "$ARTIFACT_FILE" ]; then
            echo "Error: Artifact file $ARTIFACT_FILE not found"
            exit 1
          fi
          
          echo "Uploading $ARTIFACT_FILE to s3://${S3_BUCKET_NAME}/"
          aws s3 cp "$ARTIFACT_FILE" "s3://${S3_BUCKET_NAME}/sap/$ARTIFACT_FILE" \
            --no-progress
          
          echo "Upload complete!"
          echo "S3 URL: s3://${S3_BUCKET_NAME}/sap/$ARTIFACT_FILE"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ github.event.repository.name }}-${{ steps.tag.outputs.tag-name }}.zip
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  jira-release:
    needs: check-canary-branch
    if: needs.check-canary-branch.outputs.is-canary == 'true'
    uses: tierconnect/mojix-github-library/.github/workflows/jira-component-release.yml@main
    secrets: inherit
